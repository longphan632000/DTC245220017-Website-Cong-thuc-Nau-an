services:
  # 1. Ứng dụng, CSDL và reverse proxy: commit 1.
  nginx:
    image: nginx:alpine
    container_name: d29-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - recipe-app

  recipe-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: d29-recipe-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: d29-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chay bash scripts/tao-mat-khau.sh truoc}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Chua tao mat khau MySQL}
      REPORT_PASSWORD: ${REPORT_PASSWORD:?Chua tao mat khau tai khoan chi doc}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:?Chua tao mat khau exporter}
      WEB_ADMIN_PASSWORD_HASH: ${WEB_ADMIN_PASSWORD_HASH:?Chua tao hash mat khau admin}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql/02-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: d29-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8082:80"
    networks:
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy

  # ================= 2. MONITORING STACK (COMMIT 2) =================
  prometheus:
    image: prom/prometheus:latest
    container_name: d29-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Chua tao mat khau Grafana}
    container_name: d29-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    command: --housekeeping_interval=30s
    container_name: d29-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: d29-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: d29-mysql-exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:?Chua tao mat khau exporter}
    ports:
      - "9104:9104"
    volumes:
      - ./prometheus/.my.cnf:/.my.cnf:ro
    command:
      - '--config.my-cnf=/.my.cnf'
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: d29-nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    networks:
      - monitoring-net
    depends_on:
      - nginx

  # ================= 3. LOGGING STACK (COMMIT 3) =================
  loki:
    image: grafana/loki:2.9.8
    container_name: d29-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:2.9.8
    container_name: d29-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-net
    depends_on:
      - loki

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
